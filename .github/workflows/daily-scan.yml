name: daily-scan

# Daily zero-token job board scan for Job Search Desk.
# Runs upstream career-ops scan.mjs against the user's sources in profile/
# and commits the results back, so the cloud scoring task can read them.
#
# Schedule is UTC. 10:13 UTC = 5:13 AM Central (summer) / 4:13 AM (winter),
# about an hour before the scoring task. Off the hour on purpose: GitHub
# delays or skips heavily contended :00 schedules.
#
# A push to the scan-now branch triggers a run without API access; the
# scoring task and the setup flow push an empty commit there to start a
# scan on demand. Every run scans and commits on main, whatever the trigger.

on:
  schedule:
    - cron: "13 10 * * *"
  workflow_dispatch: {}
  push:
    branches: [scan-now]

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

env:
  CAREER_OPS_DATA_DIR: profile
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  scan:
    # The template itself never scans; a friend's copy scans once setup has started.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (no browsers)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check that setup has started
        id: ready
        run: |
          if [ -f profile/.setup-state.json ] || [ -f profile/cv.md ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Setup has not started yet; nothing to scan."; fi
      - name: Scan job boards
        if: steps.ready.outputs.go == 'true'
        run: node scan.mjs --quiet 2>&1 | tee profile/data/last-scan.log
      - name: Save job descriptions
        if: always() && steps.ready.outputs.go == 'true'
        run: node desk/fetch-pending-jds.mjs 2>&1 | tee -a profile/data/last-scan.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "job-search-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add profile/data profile/jds || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "scan: $(date -u +%F) results"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
