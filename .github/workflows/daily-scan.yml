name: daily-scan

# Daily zero-token job board scan for Job Search Desk.
# Runs upstream career-ops scan.mjs against the user's sources in profile/
# and commits the results back, so the cloud scoring task can read them.
#
# Two fixed times, both UTC, both before 6:27 AM anywhere in the mainland US
# (when the daily run reads the results): 3:13 and 9:13. The second run is a
# safety net, since GitHub sometimes skips scheduled runs; when the first one
# worked it finds little that is new. Off the hour on purpose: GitHub delays
# heavily contended :00 schedules. The times are fixed so nobody has to edit
# this file (Claude's GitHub access can't change it).
#
# A push to the scan-now branch triggers a run on demand (setup step 7).
# Every run scans and commits on main, whatever the trigger.

on:
  schedule:
    - cron: "13 3 * * *"
    - cron: "13 9 * * *"
  workflow_dispatch: {}
  push:
    branches: [scan-now]

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

env:
  CAREER_OPS_DATA_DIR: profile
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

defaults:
  run:
    shell: bash

jobs:
  scan:
    # The template itself never scans; a friend's copy scans once setup has started.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (no browsers)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check that setup has started
        id: ready
        run: |
          if [ -f profile/.setup-state.json ] || [ -f profile/cv.md ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Setup has not started yet; nothing to scan."; fi
      # A failed scan is recorded (scan-runs.tsv, last-scan.log) and shown on the job page;
      # the run itself still succeeds, so GitHub doesn't email her about it.
      - name: Scan job boards
        if: steps.ready.outputs.go == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          node scan.mjs --quiet 2>&1 | tee profile/data/last-scan.log
      # The nightly sweep: public directories of about 15,000 companies on Greenhouse, Lever and
      # Ashby, checked for her titles and locations (portals.yml title_filter, or title_filter_full).
      # Only on the first scheduled run of the night (and when started by hand), off when desk.yml
      # says board_sweep: false. A sweep cut short by the time limit continues the next night.
      - name: Sweep public job boards
        if: steps.ready.outputs.go == 'true' && (github.event.schedule == '13 3 * * *' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set -o pipefail
          if grep -Eq '^board_sweep:[[:space:]]*false' profile/config/desk.yml 2>/dev/null; then echo "Sweep turned off."; exit 0; fi
          FLAGS="--since 2 --ats greenhouse,lever,ashby"
          if [ -f profile/data/cache/ats-full-checkpoint.json ]; then FLAGS="$FLAGS --resume"; fi
          node scan-ats-full.mjs $FLAGS 2>&1 | tail -40 | tee profile/data/last-sweep.log
      - name: Save job descriptions
        if: always() && steps.ready.outputs.go == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          node desk/fetch-pending-jds.mjs 2>&1 | tee -a profile/data/last-scan.log
      - name: Commit results
        if: always() && steps.ready.outputs.go == 'true'
        run: |
          git config user.name "job-search-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add profile/data profile/jds || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -qm "scan: $(date -u +%F) results"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "Could not save the scan results after 3 tries."
          exit 1
